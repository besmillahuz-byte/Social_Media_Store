<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media Store</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5fa;color:#222;direction:rtl}
header{background:#182848;color:white;text-align:center;padding:25px 15px}
.container{max-width:600px;margin:25px auto;padding:22px;background:white;border-radius:12px;box-shadow:0 4px 15px #0001}
label{display:block;margin:16px 0 7px;font-weight:bold}
input,select{display:block;width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;font-size:16px;background:white}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:7px;background:#1769ff;color:white;font-size:17px;cursor:pointer}
button:hover{background:#0c4ec7}
#availability{color:#c62828;font-weight:bold;margin-top:15px}
#result{margin-top:20px;overflow-wrap:anywhere}
</style>
</head>

<body>

<header>
<h1>Social Media Store</h1>
<p>خدمات شبکه‌های اجتماعی</p>
</header>

<main class="container">

<label for="platform">پلتفرم را انتخاب کنید:</label>
<select id="platform" onchange="loadServices()">
<option value="tiktok">TikTok</option>
<option value="facebook">Facebook</option>
<option value="youtube">YouTube</option>
<option value="instagram">Instagram</option>
<option value="other">سایر خدمات و پلتفرم‌ها</option>
</select>

<label for="service">نوع خدمات:</label>
<select id="service" onchange="loadPackages()"></select>

<div id="packageSection">
<label for="package">بسته خدمات:</label>
<select id="package" onchange="updatePrice()"></select>
</div>

<div id="customSection" style="display:none">
<label for="customService">نام پلتفرم یا خدمات:</label>
<input id="customService" type="text" placeholder="نام خدمات را بنویسید">

<label for="customQuantity">تعداد دلخواه:</label>
<input id="customQuantity" type="number" min="1" placeholder="مثلاً 1000">
</div>

<p id="availability"></p>
<p>قیمت: <strong id="price">0</strong></p>

<label for="customerName">نام شما:</label>
<input id="customerName" type="text" placeholder="نام خود را بنویسید">

<label for="profileLink">لینک پروفایل یا پست:</label>
<input id="profileLink" type="url" placeholder="لینک را وارد کنید">

<label for="phone">شماره تماس:</label>
<input id="phone" type="tel" placeholder="شماره تماس">

<button onclick="submitOrder()">ثبت سفارش</button>

<div id="result"></div>

</main>

<script>
const services = {
tiktok:{
followers:{name:"فالور تیک‌تاک",packages:[
{quantity:100,price:50},
{quantity:500,price:200},
{quantity:1000,price:350},
{quantity:5000,price:1500}
]},
likes:{name:"لایک تیک‌تاک",packages:[
{quantity:100,price:25},
{quantity:500,price:100},
{quantity:1000,price:180}
]},
views:{name:"ویو تیک‌تاک",packages:[
{quantity:1000,price:30},
{quantity:5000,price:100},
{quantity:10000,price:180}
]}
},

facebook:{
followers:{name:"فالور فیسبوک",packages:[
{quantity:100,price:50},
{quantity:500,price:200},
{quantity:1000,price:350}
]},
likes:{name:"لایک فیسبوک",packages:[
{quantity:100,price:30},
{quantity:500,price:120},
{quantity:1000,price:200}
]},
views:{name:"ویو فیسبوک",packages:[
{quantity:1000,price:30},
{quantity:5000,price:100},
{quantity:10000,price:180}
]}
},

youtube:{
subscribers:{name:"سبسکرایبر یوتیوب",packages:[
{quantity:100,price:150},
{quantity:500,price:650},
{quantity:1000,price:1200}
]},
likes:{name:"لایک یوتیوب",packages:[
{quantity:100,price:50},
{quantity:500,price:200},
{quantity:1000,price:350}
]},
views:{name:"ویو یوتیوب",packages:[
{quantity:1000,price:40},
{quantity:5000,price:150},
{quantity:10000,price:280}
]}
},

instagram:{
followersGuaranteed:{
name:"فالور تضمینی اینستاگرام",
unavailable:true,packages:[]
},
followers:{
name:"فالور اینستاگرام",
unavailable:true,packages:[]
},
likes:{name:"لایک اینستاگرام",packages:[
{quantity:100,price:25},
{quantity:500,price:100},
{quantity:1000,price:180}
]},
views:{name:"ویو اینستاگرام",packages:[
{quantity:1000,price:30},
{quantity:5000,price:100},
{quantity:10000,price:180}
]}
}
};

function loadServices(){
const platform=document.getElementById("platform").value;
const serviceSelect=document.getElementById("service");
const customSection=document.getElementById("customSection");
const packageSection=document.getElementById("packageSection");

serviceSelect.innerHTML="";
document.getElementById("result").innerHTML="";

if(platform==="other"){
customSection.style.display="block";
packageSection.style.display="none";
document.getElementById("availability").textContent=
"نام خدمات و تعداد دلخواه را وارد کنید. قیمت بعداً تعیین می‌شود.";
document.getElementById("price").textContent="قیمت توافقی";
return;
}

customSection.style.display="none";
packageSection.style.display="block";

Object.keys(services[platform]).forEach(key=>{
const option=document.createElement("option");
option.value=key;
option.textContent=services[platform][key].name;
serviceSelect.appendChild(option);
});

loadPackages();
}

function loadPackages(){
const platform=document.getElementById("platform").value;
if(platform==="other")return;

const serviceKey=document.getElementById("service").value;
const service=services[platform][serviceKey];
const packageSelect=document.getElementById("package");

packageSelect.innerHTML="";
document.getElementById("result").innerHTML="";

if(service.unavailable){
document.getElementById("availability").textContent=
"این خدمت فعلاً موجود نیست.";
document.getElementById("price").textContent="—";
return;
}

document.getElementById("availability").textContent="";

service.packages.forEach((item,index)=>{
const option=document.createElement("option");
option.value=index;
option.textContent=item.quantity+" عدد — "+item.price+" افغانی";
packageSelect.appendChild(option);
});

updatePrice();
}

function updatePrice(){
const platform=document.getElementById("platform").value;
if(platform==="other"){
document.getElementById("price").textContent="قیمت توافقی";
return;
}

const serviceKey=document.getElementById("service").value;
const service=services[platform][serviceKey];

if(!service||service.unavailable){
document.getElementById("price").textContent="—";
return;
}

const index=document.getElementById("package").value;
const selectedPackage=service.packages[index];

if(selectedPackage){
document.getElementById("price").textContent=
selectedPackage.price+" افغانی";
}
}

function submitOrder(){
const platformSelect=document.getElementById("platform");
const platform=platformSelect.value;
const name=document.getElementById("customerName").value.trim();
const link=document.getElementById("profileLink").value.trim();
const phone=document.getElementById("phone").value.trim();

if(!name||!link||!phone){
alert("لطفاً نام، لینک و شماره تماس خود را وارد کنید.");
return;
}

let serviceName="";
let quantity="";
let price="";

if(platform==="other"){
serviceName=document.getElementById("customService").value.trim();
quantity=document.getElementById("customQuantity").value.trim();
price="توافقی";

if(!serviceName||!quantity||Number(quantity)<1){
alert("لطفاً نام خدمت و تعداد معتبر را وارد کنید.");
return;
}
}else{
const serviceKey=document.getElementById("service").value;
const service=services[platform][serviceKey];

if(!service||service.unavailable){
alert("این خدمت فعلاً موجود نیست. لطفاً خدمت دیگری انتخاب کنید.");
return;
}

const packageIndex=document.getElementById("package").value;
const selectedPackage=service.packages[packageIndex];

if(!selectedPackage){
alert("لطفاً یک بسته انتخاب کنید.");
return;
}

serviceName=service.name;
quantity=selectedPackage.quantity;
price=selectedPackage.price+" افغانی";
}

let orderNumber=Number(localStorage.getItem("orderNumber")||1000);
orderNumber++;
localStorage.setItem("orderNumber",orderNumber);

const platformName=platformSelect.options[platformSelect.selectedIndex].text;

const message=
"سفارش جدید شماره: "+orderNumber+"\n"+
"نام مشتری: "+name+"\n"+
"پلتفرم: "+platformName+"\n"+
"خدمت: "+serviceName+"\n"+
"تعداد: "+quantity+"\n"+
"قیمت: "+price+"\n"+
"لینک: "+link+"\n"+
"شماره تماس: "+phone;

const result=document.getElementById("result");
result.innerHTML="";

const heading=document.createElement("h3");
heading.textContent="سفارش شما آماده ارسال است!";
result.appendChild(heading);

const numberText=document.createElement("p");
numberText.textContent="شماره سفارش: "+orderNumber;
result.appendChild(numberText);

const whatsappButton=document.createElement("button");
whatsappButton.textContent="ارسال سفارش در واتساپ";
whatsappButton.onclick=function(){
const whatsappNumber="93700000000";
const whatsappURL="https://wa.me/"+whatsappNumber+
"?text="+encodeURIComponent(message);
window.open(whatsappURL,"_blank");
};
result.appendChild(whatsappButton);
}

loadServices();
</script>

</body>
</html>
