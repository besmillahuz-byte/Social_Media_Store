
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afghanistan Social Media Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f5f9;color:#222}
header{background:#102b50;color:white;text-align:center;padding:25px 12px}
header h1{margin:0 0 10px}
header p{margin:0;color:#dce7f5}
.container{max-width:850px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 10px #00000010}
h2{font-size:19px;color:#173b66;margin-top:0}
label{display:block;margin:12px 0 6px;font-weight:bold}
select,input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px;background:white}
button{border:0;border-radius:8px;padding:13px 18px;font-size:16px;cursor:pointer}
.primary{background:#087b49;color:white;width:100%;margin-top:18px}
.info{background:#edf5ff;padding:12px;border-radius:8px;line-height:2}
.price{font-size:20px;font-weight:bold;color:#087b49;margin-top:15px}
footer{text-align:center;padding:20px;color:#777}
.small{font-size:13px;color:#666;line-height:1.8}
</style>
</head>
<body>

<header>
<h1>فروشگاه خدمات شبکه‌های اجتماعی</h1>
<p>Afghanistan Social Media Store</p>
</header>

<main class="container">

<div class="card">
<h2>ثبت سفارش خدمات</h2>

<label for="platform">انتخاب شبکه اجتماعی</label>
<select id="platform">
<option value="">انتخاب کنید</option>
<option value="TikTok">TikTok</option>
<option value="Instagram">Instagram</option>
<option value="Facebook">Facebook</option>
<option value="YouTube">YouTube</option>
</select>

<label for="service">انتخاب خدمات</label>
<select id="service">
<option value="">ابتدا شبکه اجتماعی را انتخاب کنید</option>
</select>

<label for="quantity">تعداد مورد نظر</label>
<input id="quantity" type="number" min="100" step="100" placeholder="مثلاً 1000">

<label for="link">لینک صفحه یا پست</label>
<input id="link" type="url" placeholder="https://">

<div class="price">قیمت: <span id="price">0</span> افغانی</div>

<button class="primary" id="orderBtn">ثبت سفارش از طریق واتساپ</button>
</div>

<div class="card">
<h2>روش پرداخت</h2>
<div class="info">
<strong>Hesab Pay:</strong> 0730107272<br>
<strong>Binance Pay ID:</strong> 1054538037
</div>
<p class="small">پس از پرداخت، رسید پرداخت را همراه با شماره سفارش از طریق واتساپ ارسال کنید.</p>
</div>

</main>

<footer>Afghanistan Social Media Store</footer>

<script>
"use strict";

const services = {
 TikTok: [
  {name:"فالوور تیک‌تاک",rate:100},
  {name:"لایک تیک‌تاک",rate:50},
  {name:"ویو تیک‌تاک",rate:20}
 ],
 Instagram: [
  {name:"فالوور اینستاگرام",rate:150},
  {name:"لایک اینستاگرام",rate:50},
  {name:"ویو اینستاگرام",rate:20}
 ],
 Facebook: [
  {name:"فالوور فیسبوک",rate:120},
  {name:"لایک فیسبوک",rate:50},
  {name:"ویو فیسبوک",rate:20}
 ],
 YouTube: [
  {name:"سابسکرایبر یوتیوب",rate:300},
  {name:"لایک یوتیوب",rate:80},
  {name:"ویو یوتیوب",rate:30}
 ]
};

const platform = document.getElementById("platform");
const service = document.getElementById("service");
const quantity = document.getElementById("quantity");
const link = document.getElementById("link");
const price = document.getElementById("price");

function loadServices(){
 service.innerHTML = '<option value="">انتخاب خدمات</option>';
 const selected = services[platform.value] || [];

 selected.forEach((item,index)=>{
  const option = document.createElement("option");
  option.value = String(index);
  option.textContent = item.name;
  service.appendChild(option);
 });

 calculatePrice();
}

function calculatePrice(){
 const selected = services[platform.value] || [];
 const item = selected[Number(service.value)];
 const count = Number(quantity.value);

 if(!item || !Number.isFinite(count) || count < 100){
  price.textContent = "0";
  return 0;
 }

 const total = Math.ceil(count / 1000 * item.rate);
 price.textContent = total.toLocaleString("en-US");
 return total;
}

platform.addEventListener("change",loadServices);
service.addEventListener("change",calculatePrice);
quantity.addEventListener("input",calculatePrice);

function createOrderNumber(){
 const key = "social_store_order_number";
 let number = Number(localStorage.getItem(key)) || 1000;
 number++;
 localStorage.setItem(key,String(number));
 return number;
}

document.getElementById("orderBtn").addEventListener("click",function(){
 const selected = services[platform.value] || [];
 const item = selected[Number(service.value)];
 const count = Number(quantity.value);
 const pageLink = link.value.trim();

 if(!platform.value || !item){
  alert("لطفاً شبکه اجتماعی و خدمات را انتخاب کنید.");
  return;
 }

 if(!Number.isFinite(count) || count < 100){
  alert("تعداد باید حداقل 100 باشد.");
  return;
 }

 if(!pageLink || !/^https?:\/\/\S+/i.test(pageLink)){
  alert("لطفاً لینک معتبر صفحه یا پست را وارد کنید.");
  return;
 }

 const total = calculatePrice();
 const orderNumber = createOrderNumber();

 const message =
 "سلام، می‌خواهم سفارش ثبت کنم.%0A"+
 "شماره سفارش: "+orderNumber+"%0A"+
 "شبکه اجتماعی: "+platform.value+"%0A"+
 "خدمات: "+item.name+"%0A"+
 "تعداد: "+count+"%0A"+
 "لینک: "+pageLink+"%0A"+
 "قیمت: "+total+" افغانی";

 const whatsappURL = "https://wa.me/93799250544?text="+message;
 window.open(whatsappURL,"_blank");
});
</script>

</body>
</html>
